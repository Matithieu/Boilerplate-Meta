services:
  postgres:
    image: postgres:16.4
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin4:
    image: dpage/pgadmin4:8.11
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      SCRIPT_NAME: /pgadmin4
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./config/pgadmin/servers.json:/pgadmin4/servers.json
    restart: unless-stopped

  keycloak-db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB}
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      PGPORT: 5433
    volumes:
      - keycloak-db:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.6
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5433/${KEYCLOAK_DB}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_ENABLED: true
      KC_HTTP_PORT: 8080
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: ${FULL_DOMAIN}/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: true
      KC_PROXY_HEADERS: "xforwarded"
      PROXY_ADDRESS_FORWARDING: true
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      HOSTNAME_PORT: ${HOSTNAME_PORT}
      KC_METRICS_ENABLED: true
      KEYCLOAK_ADMIN_CLI: ${KEYCLOAK_ADMIN_CLI}
      KEYCLOAK_ADMIN_CLI_PASSWORD: ${KEYCLOAK_ADMIN_CLI_PASSWORD}
      KEYCLOAK_USER_TEST_PASSWORD: ${KEYCLOAK_USER_TEST_PASSWORD}
    volumes:
      - ./config/keycloak:/opt/keycloak/data/import
      - ./config/keycloak/theme:/opt/keycloak/providers
    command: ["start", "--import-realm"]
    depends_on:
      - keycloak-db
    restart: unless-stopped
    healthcheck:
      test: timeout 10s bash -c ':> /dev/tcp/localhost/8080'
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 25s

  backend:
    image: ${API_IMAGE}
    environment:
      HOSTNAME: ${HOSTNAME}
      FULL_DOMAIN: ${FULL_DOMAIN}
      SPRING_JPA_SHOW_SQL: ${SPRING_JPA_SHOW_SQL:-false}
      SPRING_PROFILES_ACTIVE: prod
      # Postgres Configuration
      POSTGRES_DATA_SOURCE_URL: ${POSTGRES_DATA_SOURCE_URL}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Keycloak Configuration
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KEYCLOAK_ADMIN_CLI_REALM: ${KEYCLOAK_ADMIN_CLI_REALM}
      KEYCLOAK_ADMIN_CLI: ${KEYCLOAK_ADMIN_CLI}
      KEYCLOAK_ADMIN_CLI_PASSWORD: ${KEYCLOAK_ADMIN_CLI_PASSWORD}
      REDIRECT_URI: https://${HOSTNAME_PORT}/oauth2/callback
      REGISTER_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      # Redis Configuration
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Stripe Configuration
      STRIPE_API_KEY: ${STRIPE_API_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRICE_ID_FREE: ${STRIPE_PRICE_ID_FREE}
      STRIPE_PRICE_ID_BASIC: ${STRIPE_PRICE_ID_BASIC}
      STRIPE_PRICE_ID_PREMIUM: ${STRIPE_PRICE_ID_PREMIUM}
      # Configuration
      PROXY_BASE_URL: ${FULL_DOMAIN}
      OAUTH_BASE_URL: ${FULL_DOMAIN}/oauth2
      OAUTH_SIGN_IN_URL: "$${OAUTH_BASE_URL}/sign_in"
      OAUTH_SIGN_OUT_URL: "$${OAUTH_BASE_URL}/sign_out"
      OAUTH_SIGN_IN_REDIRECT_URL: ${FULL_DOMAIN}/ui/ai
      OAUTH_SIGN_OUT_REDIRECT_URL: ${FULL_DOMAIN}
      STRIPE_BILLING_PORTAL_CODE: ${STRIPE_BILLING_PORTAL_CODE}
      PUBLIC_POSTHOG_KEY: ${PUBLIC_POSTHOG_KEY}
      PUBLIC_POSTHOG_HOST: ${PUBLIC_POSTHOG_HOST}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: "curl --fail --silent http://backend:8083/actuator/health || exit 1"
      interval: 10s
      timeout: 60s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis
    restart: unless-stopped

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.0
    environment:
      OAUTH2_PROXY_PROVIDER: "keycloak-oidc"
      OAUTH2_PROXY_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      OAUTH2_PROXY_REDIRECT_URL: "https://${HOSTNAME_PORT}/oauth2/callback"
      # Find the client secret in realm-export.json
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET}
      OAUTH2_PROXY_OIDC_ISSUER_URL: "${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}"
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_BACKEND_LOGOUT_URL: "${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/logout?post_logout_redirect_uri=https%3A%2F%2F${HOSTNAME}&id_token_hint={id_token}"
      OAUTH2_PROXY_COOKIE_SECRET: "${OAUTH2_PROXY_COOKIE_SECRET}"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_SAME_SITE: "strict"
      OAUTH2_PROXY_COOKIE_REFRESH: "168h" # 7 days
      OAUTH2_PROXY_COOKIE_EXPIRE: "4320h" # 180 days
      OAUTH2_PROXY_COOKIE_DOMAIN: ${HOSTNAME}
      OAUTH2_PROXY_HTTP_ADDRESS: http://0.0.0.0:4180
      OAUTH2_PROXY_UPSTREAMS: "static://202"
      OAUTH2_PROXY_SESSION_STORE_TYPE: "redis"
      OAUTH2_PROXY_REDIS_CONNECTION_URL: "redis://redis:6379"
      OAUTH2_PROXY_PASS_AUTHORIZATION_HEADER: "true"
      OAUTH2_PROXY_PASS_ACCESS_TOKEN: "true"
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: "S256"
      OAUTH2_PROXY_LOG_LEVEL: debug
      OAUTH2_PROXY_AUTH_LOGGING_FORMAT: "{{.Client}} - {{.Username}} [{{.Timestamp}}] [{{.Status}}] {{.Message}}"
      OAUTH2_PROXY_REQUEST_LOGGING_FORMAT: "{{.Client}} - {{.Username}} [{{.Timestamp}}] {{.Host}} {{.RequestMethod}} {{.StatusCode}} {{.Upstream}} {{.UserAgent}} {{.RequestDuration}}"
      OAUTH2_PROXY_STANDARD_LOGGING_FORMAT: "[{{.Timestamp}}] [{{.File}}] {{.Message}}"
      OAUTH2_PROXY_SSL_INSECURE_SKIP_VERIFY: "true"
      OAUTH2_SKIP_JWT_BEARER_TOKENS: "false"
      # (WARNING: this may contain sensitive information - do not use in production)
      OAUTH2_PROXY_SHOW_DEBUG_ON_ERROR: false
      # List of ip of stripe:
      OAUTH2_PROXY_WHITELIST_DOMAIN: "localhost,localhost:5173,localhost:443,${HOSTNAME_PORT}"
    command:
      - --whitelist-domain=${HOSTNAME}
      - --whitelist-domain=${HOSTNAME_PORT}
      - --whitelist-domain=localhost
      - --whitelist-domain=localhost:443
      - --insecure-oidc-allow-unverified-email=true
      - --prefer-email-to-user=true
      - --set-xauthrequest=true
      - --skip-provider-button=true
      - --insecure-oidc-skip-issuer-verification=true
      - --skip-auth-route=/api/v1/stripe/webhook
      - --skip-auth-route=GET=/api/configuration
      - --skip-auth-route=GET=/api/v1/register
      - --skip-auth-route=GET=/api/actuator/health
    depends_on:
      keycloak:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  prometheus:
    image: prom/prometheus
    volumes:
      - prometheus_data:/prometheus
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped

  grafana:
    image: grafana/grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_SERVER_SERVE_FROM_SUB_PATH: true
      GF_USERS_ALLOW_SIGN_UP: false
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/grafana/"
    depends_on:
      prometheus:
        condition: service_started
      backend:
        condition: service_healthy
    restart: unless-stopped

  traefik:
    image: traefik:v3.2.1
    ports:
      - "80:80"
      - "443:443"
    environment:
      HOSTNAME: ${HOSTNAME}
      HETZNER_API_KEY: ${HETZNER_API_KEY}
    volumes:
      - ./config/traefik/prod:/etc/traefik
      - ./config/traefik/prod/:/acme.json
      - letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock

  frontend:
    image: ${FRONTEND_IMAGE}
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:
  keycloak-db:
  certs:
  grafana_data:
  prometheus_data:
  letsencrypt:
