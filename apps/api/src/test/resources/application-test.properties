## Database - override with H2 in-memory (bypasses ${POSTGRES_*} env var requirement)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

## JPA - override dialect and DDL mode
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

## Liquibase - disable (H2 schema created by Hibernate)
spring.liquibase.enabled=false

## Redis - use simple in-memory cache, no Redis connection needed
REDIS_HOST=localhost
REDIS_PORT=6379
spring.cache.type=simple

## Spring Profile
SPRING_PROFILES_ACTIVE=test

## Spring AI - dummy values, no network connections made at startup
spring.ai.openai.api-key=test-key
spring.ai.openai.base-url=http://localhost:9999/
spring.ai.chat.memory.repository.jdbc.initialize-schema=never

## Keycloak - KeycloakInstance is a @Component and needs these @Value properties
KEYCLOAK_URL=http://localhost:9999
KEYCLOAK_REALM=test-realm
KEYCLOAK_ADMIN_CLI_REALM=master
KEYCLOAK_ADMIN_CLI=admin
KEYCLOAK_ADMIN_CLI_PASSWORD=admin-password

## OAuth config (EnvConfig @Value bindings)
OAUTH_BASE_URL=https://auth.test.local
OAUTH_SIGN_IN_URL=https://auth.test.local/sign-in
OAUTH_SIGN_OUT_URL=https://auth.test.local/sign-out
OAUTH_SIGN_IN_REDIRECT_URL=https://app.test.local/ui
OAUTH_SIGN_OUT_REDIRECT_URL=https://app.test.local/ui

## Stripe config (StripeConfig + EnvConfig @Value bindings)
STRIPE_PRICE_ID_FREE=price_free_test
STRIPE_PRICE_ID_BASIC=price_basic_test
STRIPE_PRICE_ID_PREMIUM=price_premium_test
STRIPE_BILLING_PORTAL_CODE=portal_test

## Stripe API (PaymentController @Value)
STRIPE_API_KEY=sk_test_dummy
STRIPE_WEBHOOK_SECRET=whsec_test_dummy

## CORS (CorsConfig @Value)
FULL_DOMAIN=https://app.test.local

## PaymentController @Value
HOSTNAME=app.test.local

## PostHog - optional (has default empty string)
PUBLIC_POSTHOG_KEY=test-posthog-key
PUBLIC_POSTHOG_HOST=https://posthog.test.local

## Suppress SPRING_JPA_* placeholder resolution (application.properties uses ${} references)
SPRING_JPA_SHOW_SQL=false
SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.H2Dialect
POSTGRES_DATA_SOURCE_URL=jdbc:h2:mem:testdb
POSTGRES_USER=sa
POSTGRES_PASSWORD=
