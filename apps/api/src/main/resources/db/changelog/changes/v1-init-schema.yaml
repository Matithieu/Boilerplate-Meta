databaseChangeLog:
  - changeSet:
      id: v1-init-schema
      author: boilerplate
      changes:

        - createTable:
            tableName: app_settings
            columns:
              - column:
                  name: id
                  type: SERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: last_reset_quota_date
                  type: DATE

        - createTable:
            tableName: user_quota
            columns:
              - column:
                  name: user_id
                  type: VARCHAR(255)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: quota_allocated
                  type: INTEGER
              - column:
                  name: quota_used
                  type: INTEGER

        - createTable:
            tableName: user_conversation
            columns:
              - column:
                  name: id
                  type: SERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: title
                  type: VARCHAR(255)
              - column:
                  name: conversation_id
                  type: VARCHAR(255)
              - column:
                  name: user_id
                  type: VARCHAR(255)

        - createTable:
            tableName: spring_ai_chat_memory
            columns:
              - column:
                  name: id
                  type: SERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: conversation_id
                  type: VARCHAR(36)
              - column:
                  name: type
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: content
                  type: TEXT
              - column:
                  name: timestamp
                  type: TIMESTAMP
