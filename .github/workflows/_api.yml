name: API Pipeline

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "24"
          cache: gradle

      - name: Build with Gradle
        working-directory: apps/api
        run: ./gradlew clean build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: api-build
          path: apps/api/build/libs/*.jar
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "24"
          cache: gradle

      - name: Run API tests
        working-directory: apps/api
        run: ./gradlew test --no-daemon

  docker-build:
    needs: test
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup env
        run: echo "${{ secrets.SECRET }}" > .env

      - name: Load API image name
        run: |
          API_IMAGE=$(grep '^API_IMAGE=' .env | cut -d'=' -f2-)
          if [ -z "$API_IMAGE" ]; then
            echo "Error: API_IMAGE is not set in .env (SECRET)"
            exit 1
          fi
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "API_IMAGE=${API_IMAGE}:${SHORT_SHA}" >> $GITHUB_ENV

      - uses: docker/setup-buildx-action@v3

      - name: Build API Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          push: false
          tags: ${{ env.API_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=api-image.tar

      - name: Compress image
        run: gzip api-image.tar

      - uses: actions/upload-artifact@v4
        with:
          name: api-docker-image
          path: api-image.tar.gz
          retention-days: 1
