name: API Pipeline

on:
  workflow_call:
    inputs:
      image-tag:
        type: string
        required: true

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "24"
          cache: gradle

      - name: Build with Gradle
        working-directory: apps/api
        run: ./gradlew clean build -x test --no-daemon --quiet

      - uses: actions/upload-artifact@v4
        with:
          name: api-build
          path: apps/api/build/libs/*.jar
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "24"
          cache: gradle

      - name: Run API tests
        working-directory: apps/api
        run: ./gradlew test --no-daemon --rerun-tasks

  docker-build:
    needs: test
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        run: echo "API_IMAGE=${{ secrets.NEXUS_DOCKER_URL }}/api:${{ inputs.image-tag }}" >> $GITHUB_ENV

      - name: Download pre-built JAR
        uses: actions/download-artifact@v4
        with:
          name: api-build
          path: apps/api/build/libs

      - uses: docker/setup-buildx-action@v3

      - name: Build API Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile.ci
          push: false
          tags: ${{ env.API_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=api-image.tar

      - name: Compress image
        run: gzip api-image.tar

      - uses: actions/upload-artifact@v4
        with:
          name: api-docker-image
          path: api-image.tar.gz
          retention-days: 1
