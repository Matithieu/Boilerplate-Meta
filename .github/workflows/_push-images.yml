name: Push Images

on:
  workflow_call:
    inputs:
      api-changed:
        type: string
        required: true
      web-changed:
        type: string
        required: true
      image-tag:
        type: string
        required: true

jobs:
  push:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    env:
      NEXUS_DOCKER_URL: ${{ secrets.NEXUS_DOCKER_URL }}
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image names
        run: |
          echo "API_IMAGE=${{ secrets.NEXUS_DOCKER_URL }}/api:${{ inputs.image-tag }}" >> $GITHUB_ENV
          echo "FRONTEND_IMAGE=${{ secrets.NEXUS_DOCKER_URL }}/frontend:${{ inputs.image-tag }}" >> $GITHUB_ENV

      - name: Log in to Nexus Docker registry
        run: echo "${NEXUS_PASSWORD}" | docker login "${NEXUS_DOCKER_URL}" -u "${NEXUS_USERNAME}" --password-stdin

      - name: Download API Docker image
        if: inputs.api-changed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: api-docker-image

      - name: Download Web Docker image
        if: inputs.web-changed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: web-docker-image

      - name: Load and push API image
        if: inputs.api-changed == 'true'
        run: |
          docker load < api-image.tar.gz
          docker push ${API_IMAGE}

      - name: Load and push Web image
        if: inputs.web-changed == 'true'
        run: |
          docker load < web-image.tar.gz
          docker push ${FRONTEND_IMAGE}
