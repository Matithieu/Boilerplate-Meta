entryPoints:
  web:
    address: ':80'
    http:
      redirections:
        entryPoint:
          to: 'websecure'
          scheme: https
          permanent: true
  websecure:
    address: ':443'

api:
  insecure: false
  dashboard: false
  debug: false

serversTransport:
  insecureSkipVerify: false

log:
  level: INFO

providers:
  docker:
    exposedByDefault: false

  file:
    filename: /etc/traefik/conf.d/traefik_dynamic.yml

certificatesResolvers:
  myresolver:
    acme:
      dnsChallenge:
        provider: hetzner
      tlsChallenge: {}
      email: amarmathieu@gmail.com
      storage: /etc/traefik/acme.json
      httpChallenge:
        # used during the challenge
        entryPoint: web
